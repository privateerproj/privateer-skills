header:
  schema-version: 2.2.0
  last-updated: "2026-11-09"
  last-reviewed: "2026-11-09"
  url: https://github.com/privateerproj/privateer-skills/blob/main/.github/security-insights.yml
  project-si-source: https://raw.githubusercontent.com/privateerproj/.github/refs/heads/main/.github/security-insights.yml
  comment: |
    This file contains only the repository information for the Privateer Agent Skills.

repository:
  url: https://github.com/privateerproj/privateer-skills
  status: active
  bug-fixes-only: false
  accepts-change-request: true
  accepts-automated-change-request: true
  no-third-party-packages: false
  core-team:
    - name: Eddie Knight
      affiliation: Sonatype
      social: https://bsky.app/profile/eddieknight.dev
      primary: true
    - name: Jason Meridth
      affiliation: Revanite
      social: https://github.com/jmeridth
      primary: false
  documentation:
    contributing-guide: https://github.com/privateerproj/.github/blob/main/.github/CONTRIBUTING.md
    security-policy: https://github.com/privateerproj/.github/blob/main/.github/SECURITY.md
  license:
    url: https://github.com/privateerproj/privateer-skills/blob/main/LICENSE
    expression: Apache-2.0
  security:
    assessments:
      self:
        comment: |
          No self-assessment has been published yet. The repository ships Markdown
          and a small Go helper (skills/privateer-plugin/scripts) that reads local
          catalog, source and result files; it makes no network calls and holds no secrets.
    champions:
      - name: Jason Meridth
        primary: true
    tools:
      - name: Dependabot
        type: SCA
        version: "2"
        rulesets:
          - default
        results:
          adhoc:
            name: Scheduled SCA Scan Results
            predicate-uri: https://docs.github.com/en/graphql/reference/objects#repositoryvulnerabilityalert
            location: https://github.com/privateerproj/privateer-skills/blob/main/.github/dependabot.yml
            comment: |
              Dependabot covers the Go module in skills/privateer-plugin/scripts and the
              SHA-pinned GitHub Actions. Its alerts are visible to maintainers in the Security tab.
        integration:
          adhoc: true
          ci: false
          release: false
