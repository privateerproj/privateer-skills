subject: repo:privateerproj@116728460/privateer-skills@1451001353:ref:refs/heads/main
claim_pattern:
  job_workflow_ref: "^privateerproj/privateer-skills/.github/workflows/osps-security-assessment.yml@refs/heads/main$"

permissions:
  contents: read
  statuses: read
  deployments: read
  security_events: read
  administration: read
